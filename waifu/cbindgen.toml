# How waifu.h is written from src/c_api.rs. See docs/ffi.md for the contract it keeps.
#
# Everything the header declares is this library's own: it includes nothing but the C library's,
# and shares no type with libwaifu_modelmanager's.

language = "C"
include_guard = "LIBWAIFU_WAIFU_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "type"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
# size_t for a length, as C callers expect and Swift imports as Int.
usize_is_size_t = true
autogen_warning = "/* Written by cbindgen from waifu/src/c_api.rs. Change that, not this. */"
header = """/* The MIT License (MIT). Copyright (c) 2026 Xiaoyang Chen. See LICENSE. */"""

[defines]

[enum]
rename_variants = "None"
prefix_with_name = false

[export]
# Every type of the engine's, whether or not a function names it directly.
include = [
    "WaifuStatusCode",
    "WaifuStatus",
    "WaifuLogLevel",
    "WaifuLogEvent",
    "WaifuStage",
    "WaifuProgressEvent",
    "WaifuCompletionEvent",
    "WaifuDevice",
    "WaifuImage",
    "WaifuImageInput",
    "WaifuDrawRequest",
    "WaifuImageCompletionEvent",
    "WaifuAudio",
    "WaifuSpeakRequest",
    "WaifuVoiceConversionRequest",
    "WaifuAudioCompletionEvent",
]
