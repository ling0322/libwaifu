[package]
name = "waifu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Your local AI waifu: language model inference on top of the flint tensor library"
# Declares that this crate links libflint.a, so Cargo runs build.rs and keeps the native library
# to a single owner in the dependency graph.
links = "flint"

[lib]
name = "waifu"
path = "src/lib.rs"
# rlib for Rust consumers, staticlib and cdylib for C programs. Both C artifacts are
# self-contained down to the C++ kernels linked from libflint.a.
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "waifu"
path = "src/bin/waifu.rs"
required-features = ["cli"]

[features]
# The command line tool. Off by default so that using this crate as a library stays
# dependency-free; the binary needs an HTTPS client to fetch models and a terminal library to
# draw with.
cli = ["dep:ureq", "dep:ratatui"]

[dependencies]
# The terminal UI the draw command runs in, and only for the CLI. Trimmed to the crossterm
# backend: the default set also builds the termwiz and termina ones, which is two more terminal
# stacks than a program that runs in one terminal needs.
ratatui = { version = "0.29", default-features = false, features = [
    "crossterm",
    "underline-color",
], optional = true }
# Only for downloading models, and only for the CLI. The library itself has no dependencies; an
# HTTPS client is the one thing here that is not worth writing by hand.
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
