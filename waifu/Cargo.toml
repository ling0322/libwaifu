[package]
name = "waifu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Your local AI waifu: diffusion image generation on top of the flint tensor library"
# Declares that this crate links libflint.a, so Cargo runs build.rs and keeps the native library
# to a single owner in the dependency graph.
links = "flint"

# A dynamic library, libwaifu.dylib (.so, waifu.dll), whose C API is all anything outside this
# crate uses: see docs/ffi.md. The Metal kernels are a section of the image flint is in, and a
# dylib carries them wherever it goes. The rlib is for this crate's own tests, for the command
# line, which links it statically and calls its C API, and for waifu-tools.
[lib]
name = "waifu"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# What the engine says about models and the machine, for the C API to hand on: a parser this
# crate would own for no reason, since it is already in the tree, under tokenizers.
#
# `Value` rather than derived types. What crosses is a handful of shapes, each built once, and a
# derive would buy nothing at the cost of a second description of every one of them.
serde_json = "1"

# Resizing the picture an image to image run starts from to the size it is drawn at. No codecs:
# a picture crosses the C API as rows of RGB, and decoding or writing a file is the caller's.
#
# Cargo.lock holds 0.25.9 rather than the newest 0.25: 0.25.10 asks for a rustc a minor version
# ahead of the one this is built with. Nothing here needs what it added, so the lock is the place
# that says so rather than a bound in the range.
image = { version = "0.25", default-features = false }

# Reading the weights, which are safetensors: the format every other runtime already writes, so a
# weight can be looked at with torch, with numpy, or with the viewer on the hub. It replaced two
# layouts of this project's own, and the zip they lived in went with them.
#
# No features beyond the default `std`: this reads a header and hands back slices of a buffer.
safetensors = "0.8"

# Mapping those files into memory, so that a weight is the page cache rather than a copy of it:
# reading a package copies nothing, and a model kept on the host is in memory once however many
# processes have it open.
memmap2 = "0.9"

# Turning a prompt into ids, from the `tokenizer.json` the model's authors published.
#
# The vocabulary, the normalizer, the pre-tokenizer and the merge ranks all live in that one file,
# so a package carries the tokenizer as it was shipped rather than a re-encoding of it, and this
# is the crate that reads it -- the same code every reference implementation runs.
#
# Trimmed to nothing native. The default set is `onig` (oniguruma, a C regex engine), `esaxx_fast`
# (a C++ suffix array, used only to *train* a vocabulary, which nothing here does) and a progress
# bar. `fancy-regex` is the pure Rust alternative to the first and the only one of the four that
# encoding needs; `http` would drag in a second hub client beside the one the cli feature has.
tokenizers = { version = "0.23", default-features = false, features = [
    "fancy-regex",
] }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
