[package]
name = "waifu2d"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "libwaifu2d: a drawing in layers rigged to move, and drawn by Metal, Direct3D 11 or Vulkan"

# A dynamic library, libwaifu2d.dylib (.so, waifu2d.dll), whose C API is all anything outside this
# crate uses: see docs/waifu2d.md. The static library is for an app that would rather link it in;
# the rlib for this crate's own tests and for waifu-tools. libwaifu does not link it, nor it
# libwaifu: nothing here runs a model.
[lib]
name = "waifu2d"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Layers are known by their names folded as Foundation folds them for the Mac app, NFKC: "前髪２"
# is "前髪2", half-width "ﾏﾂｹﾞ" is "マツゲ". The tables are Unicode's, not something to write again.
# MIT or Apache-2.0.
unicode-normalization = "0.1"

# A package, the drawing's own format (docs/waifu2d-package.md), is a zip of PNGs and an index.
# zip (MIT) with nothing but deflate, which is what every other zip tool writes: no encryption,
# no bzip2, zstd or lzma. Its deflate is flate2's, given the pure Rust backend (miniz_oxide, which
# png already brings) rather than a C zlib. png (MIT or Apache-2.0) for the pictures in it, and
# for the examples'.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
png = "0.18"

# Metal, through the objc2 bindings (MIT): the device, the pipelines, the layer the app hands
# over. Nothing else on macOS needs Objective-C.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSGeometry", "objc2-core-foundation"] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLArgument",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLDrawable",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLSampler",
    "MTLTexture",
    "MTLTypes",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
    "objc2-metal",
] }

[dev-dependencies]
# The Mac app's frames, recorded as JSON, for tests/parity.rs to read.
serde_json = "1"

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
