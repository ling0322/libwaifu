name: FlashAttention prebuild

# FlashAttention is twelve kernel sources built for five architectures, and none of it moves
# between releases -- the revision is pinned in install_flash_attn.sh. Building it inside the
# release job meant paying for that on every tag, and again on every cache miss. It is built
# here instead, once per revision per platform, and the release job links what this leaves.
#
# What decides whether a build is needed is the key in third_party/flash_attn_key.sh: the hash of
# everything that changes the archive. The `paths:` filter below is a convenience that starts
# this at the right moment; the key is what makes the answer correct, because it is checked
# against what is actually published rather than against what a commit happened to touch.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this key is already published"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "third_party/install_flash_attn.sh"
      - "third_party/flash-attention/csrc/flash_attn/**"
      - "third_party/flash_attn_key.sh"
      - ".github/workflows/flash-attn.yml"

permissions:
  contents: write

env:
  # An archive built against one CUDA is not one to hand a build using another, so the version is
  # named once here and goes into the key, the asset names and the manifests.
  CUDA_VERSION: "12.9.1"

  # A tag of its own rather than a version of the project: this is a dependency, not a release of
  # anything. Assets accumulate under it, one per platform per key, so a release tag cut months
  # ago can still find the archive it was built against.
  PREBUILT_TAG: flash-attn-prebuilt

  # The two hosts name these differently, so neither list is the other's. Windows takes the
  # _dev halves that carry the import libraries, and visual_studio_integration, which exists
  # nowhere else. Linux calls cuBLAS libcublas, without the cuda- prefix the action adds -- and
  # this archive needs it on neither host: building it wants nvcc and the runtime headers, and it
  # links nothing.
  CUDA_SUB_PACKAGES_WINDOWS: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
  CUDA_SUB_PACKAGES_LINUX: '["nvcc", "cudart", "cudart-dev", "thrust"]'

jobs:
  plan:
    name: Decide what needs building
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
      windows: ${{ steps.key.outputs.windows }}
      linux: ${{ steps.key.outputs.linux }}
    steps:
      - uses: actions/checkout@v4

      - id: key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          key=$(bash third_party/flash_attn_key.sh "${CUDA_VERSION}")
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "key is ${key}"

          # One listing, asked once, rather than a call per platform.
          published=$(gh release view "${PREBUILT_TAG}" --json assets --jq '.assets[].name' 2>/dev/null || true)

          for platform in windows linux; do
            asset="flash_attn-${platform}-cuda${CUDA_VERSION}-${key}.zip"
            if [ "${FORCE}" = "true" ]; then
              echo "${platform}=true" >> "$GITHUB_OUTPUT"
              echo "forced: rebuilding ${asset}"
            elif echo "${published}" | grep -qx "${asset}"; then
              echo "${platform}=false" >> "$GITHUB_OUTPUT"
              echo "${asset} is already published; nothing to build"
            else
              echo "${platform}=true" >> "$GITHUB_OUTPUT"
              echo "${asset} is not published; building"
            fi
          done

  windows:
    name: Windows (CUDA)
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      ASSET: flash_attn-windows-cuda12.9.1-${{ needs.plan.outputs.key }}.zip
      KEY: ${{ needs.plan.outputs.key }}

      # install_flash_attn.sh sizes its own parallelism from /proc/meminfo or sysctl and finds
      # neither under Git Bash, which would leave it compiling one kernel at a time. A runner has
      # 4 cores and 16 GB, and one kernel costs about 3 GB in cicc, so three at once is what fits.
      # Linux needs no such help: the script reads /proc/meminfo there and works it out.
      FLASH_ATTN_PARALLEL: "3"

      # The script runs a bare `cmake -S -B`, and bare on a runner that has Visual Studio means
      # the Visual Studio generator: multi-config, so the archive would land in a Debug/ of its
      # own rather than where the top-level CMakeLists looks -- and be built as Debug, since the
      # script's --build names no --config. CMake reads this from the environment, so Ninja can
      # be asked for without the script learning a new argument.
      CMAKE_GENERATOR: Ninja

    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: ${{ env.CUDA_SUB_PACKAGES_WINDOWS }}

      # Clones the CUTLASS revision FlashAttention is pinned against, which is a different one
      # from the CUTLASS the main build uses -- the whole reason this is a project of its own.
      - name: Build FlashAttention
        working-directory: third_party
        shell: bash
        run: bash install_flash_attn.sh

      - name: Package
        shell: bash
        run: bash .github/package_flash_attn.sh windows flash_attn.lib "${ASSET}" "${KEY}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flash-attn-windows-${{ needs.plan.outputs.key }}
          path: ${{ env.ASSET }}

      - name: Publish to the prebuilt release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/publish_prebuilt.sh "${PREBUILT_TAG}" "${ASSET}"

  linux:
    name: Linux (CUDA)
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ASSET: flash_attn-linux-cuda12.9.1-${{ needs.plan.outputs.key }}.zip
      KEY: ${{ needs.plan.outputs.key }}

    steps:
      - uses: actions/checkout@v4

      # The CUDA toolkit is several gigabytes and a hosted runner does not have many to spare.
      # Clearing what this build will never touch is cheaper than finding out mid-download.
      - name: Make room for CUDA
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: ${{ env.CUDA_SUB_PACKAGES_LINUX }}

      - name: Build FlashAttention
        working-directory: third_party
        shell: bash
        run: bash install_flash_attn.sh

      - name: Package
        shell: bash
        run: bash .github/package_flash_attn.sh linux libflash_attn.a "${ASSET}" "${KEY}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flash-attn-linux-${{ needs.plan.outputs.key }}
          path: ${{ env.ASSET }}

      - name: Publish to the prebuilt release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/publish_prebuilt.sh "${PREBUILT_TAG}" "${ASSET}"
